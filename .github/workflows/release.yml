name: Release

# F6.2. Construye los instaladores (NSIS y MSI en Windows; .deb y AppImage en Linux), los prueba instalándolos de verdad y,
# solo con una etiqueta `v*`, deja un BORRADOR de release con los instaladores y SHA256SUMS. Sin firma y sin secretos
# nuevos: GITHUB_TOKEN basta para el borrador. En los PR solo se construye y se prueba; no se publica nada.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "apps/desktop/**"
      - "apps/daemon/**"
      - "apps/cli/**"
      - "apps/web/**"
      - "tools/package/**"
      - "tools/version/**"
      - "package.json"
      - "pnpm-lock.yaml"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  installers:
    name: instaladores (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            bundles: deb,appimage
          - os: windows-latest
            platform: windows
            bundles: nsis,msi
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias de sistema de Tauri 2 y del smoke (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb dbus-x11
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: La versión es la misma en todos los archivos
        run: node tools/version/sync-version.mjs
      - name: Con etiqueta, la etiqueta es la versión
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "la etiqueta ${GITHUB_REF_NAME} no coincide con la versión ${version}" >&2
            exit 1
          fi
      - run: pnpm --filter @nexo/web build
      - name: Paquete de ejecución (Node, daemon, CLI, web y Robi)
        run: node tools/package/build-bundle.mjs
      - name: Instaladores (tauri build)
        env:
          # linuxdeploy es un AppImage y el runner no tiene FUSE; strip falla con las bibliotecas recientes.
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
        run: pnpm --filter @nexo/desktop exec tauri build --config src-tauri/tauri.bundle.conf.json --bundles ${{ matrix.bundles }}
      - name: Smoke de los instaladores (instala, arranca la app, /health, desinstala)
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: node tools/package/installer-smoke.mjs --dir apps/desktop/src-tauri/target/release/bundle
      - name: Reúne los instaladores y calcula SHA256SUMS
        shell: bash
        run: |
          node tools/package/collect-installers.mjs --bundle apps/desktop/src-tauri/target/release/bundle --out dist/installers --platform ${{ matrix.platform }}
          {
            echo '### Instaladores (${{ matrix.os }})'
            echo '```'
            ls -l dist/installers
            echo
            cat dist/installers/SHA256SUMS-${{ matrix.platform }}.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: instaladores-${{ matrix.platform }}
          path: dist/installers
          if-no-files-found: error
          retention-days: 14

  # Solo con una etiqueta `v*`: borrador de release con los instaladores y SHA256SUMS. Nunca se publica solo.
  draft-release:
    name: borrador de release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: installers
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with:
          pattern: instaladores-*
          path: dist/artifacts
          merge-multiple: true
      - name: SHA256SUMS conjunto
        run: node tools/package/collect-installers.mjs --merge dist/artifacts --out dist/artifacts/SHA256SUMS
      - name: Comprueba las sumas contra los archivos
        working-directory: dist/artifacts
        run: sha256sum --check SHA256SUMS
      - name: Crea el borrador
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        working-directory: dist/artifacts
        run: |
          flags=""
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          Instaladores sin firma (todavía). Verifica la descarga con `SHA256SUMS` y lee `docs/instalacion.md`
          para el aviso de SmartScreen en Windows y el de la AppImage en Linux.

          - Windows: `nexo-workspace_*_windows_x64-setup.exe` (NSIS, por usuario) y `.msi`.
          - Linux: `nexo-workspace_*_linux_x64.deb` y `.AppImage`.
          NOTES
          gh release create "$TAG" --draft $flags --verify-tag --title "Nexo Workspace $TAG" --notes-file "$RUNNER_TEMP/notes.md" \
            ./nexo-workspace_* ./SHA256SUMS
